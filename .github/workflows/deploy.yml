name: Deploy Roam extension to GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Roam extension files
        run: |
          set -euo pipefail
          mkdir deploy
          cp extension.js README.md deploy/
          [ -f extension.css ] && cp extension.css deploy/
          [ -f CHANGELOG.md ] && cp CHANGELOG.md deploy/
          touch deploy/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "deploy/"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
