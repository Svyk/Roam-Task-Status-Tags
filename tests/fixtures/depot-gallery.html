<!doctype html>
<html lang="en" data-ts-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task Status Tags gallery fixture</title>
    <link rel="stylesheet" href="../../extension.css" />
    <style id="ts-gallery-base">
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        --svy-canvas: #ffffff;
        --svy-surface: #f5f8fa;
        --svy-raised: #ffffff;
        --svy-overlay: #ffffff;
        --svy-hover: #f1f5f8;
        --svy-selected: #dbeaf7;
        --svy-border-subtle: #d8e1e8;
        --svy-border: #a7b6c2;
        --svy-text: #182026;
        --svy-text-muted: #5c7080;
        --svy-accent: #137cbd;
        --svy-danger: #a82a2a;
        --svy-ff-main: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      }

      :root[data-ts-theme="dark"] {
        color-scheme: dark;
        --svy-canvas: #182026;
        --svy-surface: #202b33;
        --svy-raised: #293742;
        --svy-overlay: #30404d;
        --svy-hover: #26333d;
        --svy-selected: #33485c;
        --svy-border-subtle: #394b59;
        --svy-border: #5c7080;
        --svy-text: #e1e8ed;
        --svy-text-muted: #b3c1cc;
        --svy-accent: #48aff0;
        --svy-danger: #ff9c9c;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--svy-canvas);
        color: var(--svy-text);
        font-family: var(--svy-ff-main);
        font-size: 14px;
        line-height: 1.45;
      }

      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 24px 28px 40px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 20px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--svy-border-subtle);
      }

      .toolbar h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 650;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }

      .control-group {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px;
        border: 1px solid var(--svy-border-subtle);
        border-radius: 8px;
        background: var(--svy-surface);
      }

      .control-group button {
        appearance: none;
        border: 0;
        border-radius: 6px;
        padding: 5px 10px;
        background: transparent;
        color: var(--svy-text);
        font: inherit;
        font-size: 12.5px;
        font-weight: 500;
        cursor: pointer;
      }

      .control-group button[aria-pressed="true"] {
        background: var(--svy-selected);
        color: var(--svy-text);
        font-weight: 600;
      }

      .section-title {
        margin: 24px 0 12px;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--svy-text-muted);
      }

      .groups-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
        gap: 16px;
      }

      .group-card {
        border: 1px solid var(--svy-border-subtle);
        border-radius: 10px;
        padding: 14px 16px;
        background: var(--svy-raised);
      }

      .group-card h2 {
        margin: 0 0 10px;
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--svy-text-muted);
      }

      .status-row {
        display: grid;
        grid-template-columns: 24px 24px minmax(0, 1fr) auto;
        align-items: center;
        column-gap: 10px;
        min-height: 32px;
        border-bottom: 1px solid color-mix(in srgb, var(--svy-border-subtle) 55%, transparent);
      }

      .status-row:last-child { border-bottom: 0; }

      .status-row-header {
        font-size: 11px;
        color: var(--svy-text-muted);
        min-height: 22px;
        border-bottom: 1px solid var(--svy-border-subtle);
      }

      .status-name {
        font-size: 13px;
        font-weight: 500;
      }

      .rm-checkbox { display: inline-flex; align-items: center; }
      .check-container { display: inline-block; position: relative; width: 16px; height: 16px; }
      .check-container input { position: absolute; opacity: 0; width: 16px; height: 16px; margin: 0; }
      .checkmark {
        position: absolute;
        inset: 0;
        width: 16px;
        height: 16px;
        border: 2px solid #738091;
        border-radius: 4px;
        background: transparent;
      }
      .check-container input:checked ~ .checkmark {
        background: #1684b7;
        border-color: #1684b7;
      }
      .check-container input:checked ~ .checkmark::after {
        content: "";
        position: absolute;
        left: 4px;
        top: 0.5px;
        width: 4px;
        height: 8px;
        border: solid #ffffff;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
      }

      .styles-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }

      @media (max-width: 900px) {
        .styles-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }

      .style-frame-card {
        border: 1px solid var(--svy-border-subtle);
        border-radius: 10px;
        overflow: hidden;
        background: var(--svy-raised);
      }

      .style-frame-card iframe {
        display: block;
        width: 100%;
        height: 760px;
        border: 0;
      }

      body.only-statuses .styles-section,
      body.only-statuses .extras-preview-section,
      body.only-styles .statuses-section,
      body.only-styles .extras-preview-section,
      body.hide-toolbar .toolbar {
        display: none;
      }

      .preview-showcase {
        display: grid;
        grid-template-columns: minmax(220px, 240px) minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }

      @media (max-width: 720px) {
        .preview-showcase { grid-template-columns: 1fr; }
      }

      .preview-showcase .ts-status-chooser.bp3-popover {
        position: static;
        display: inline-block;
        max-width: 100%;
      }

      .preview-card {
        border: 1px solid var(--svy-border-subtle);
        border-radius: 10px;
        padding: 14px 16px;
        background: var(--svy-raised);
      }

      .preview-card h2 {
        margin: 0 0 10px;
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--svy-text-muted);
      }

      .pop-badge {
        margin-left: 6px;
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 10.5px;
        color: var(--svy-text-muted);
        background: var(--svy-surface);
        border: 1px solid var(--svy-border-subtle);
      }
    </style>

      .rm-checkbox[data-ts-checkbox-status="STARRED"] { --ts-checkbox-accent-light: rgb(207, 114, 6); --ts-checkbox-accent-dark: rgb(217, 119, 6); --ts-checkbox-on-accent-light: #ffffff; --ts-checkbox-on-accent-dark: #10161a; --ts-checkbox-wash-light: rgba(217, 119, 6, 0.09); --ts-checkbox-wash-dark: rgba(217, 119, 6, 0.16); --ts-checkbox-beacon-light: rgba(207, 114, 6, 0.52); --ts-checkbox-beacon-dark: rgba(217, 119, 6, 0.68); }
      span.rm-page-ref[data-task-status-key="DISCUSS"], .ts-status-pill-preview[data-task-status-key="DISCUSS"], .ts-status-choice-glyph[data-task-status-key="DISCUSS"] { --ts-status-bg-light: rgba(139, 92, 246, 0.1); --ts-status-fg-light: rgb(114, 75, 202); --ts-status-border-light: rgba(139, 92, 246, 0.48); --ts-status-bg-dark: rgba(139, 92, 246, 0.2); --ts-status-fg-dark: rgb(181, 152, 249); --ts-status-border-dark: rgba(139, 92, 246, 0.62); }
      .rm-checkbox[data-ts-checkbox-status="DISCUSS"] { --ts-checkbox-accent-light: rgb(139, 92, 246); --ts-checkbox-accent-dark: rgb(139, 92, 246); --ts-checkbox-on-accent-light: #ffffff; --ts-checkbox-on-accent-dark: #ffffff; --ts-checkbox-wash-light: rgba(139, 92, 246, 0.09); --ts-checkbox-wash-dark: rgba(139, 92, 246, 0.16); --ts-checkbox-beacon-light: rgba(139, 92, 246, 0.52); --ts-checkbox-beacon-dark: rgba(139, 92, 246, 0.68); }
      span.rm-page-ref[data-task-status-key="BILLABLE"], .ts-status-pill-preview[data-task-status-key="BILLABLE"], .ts-status-choice-glyph[data-task-status-key="BILLABLE"] { --ts-status-bg-light: rgba(16, 185, 129, 0.1); --ts-status-fg-light: rgb(10, 117, 82); --ts-status-border-light: rgba(14, 157, 109, 0.48); --ts-status-bg-dark: rgba(16, 185, 129, 0.2); --ts-status-fg-dark: rgb(67, 200, 156); --ts-status-border-dark: rgba(16, 185, 129, 0.62); }
      .rm-checkbox[data-ts-checkbox-status="BILLABLE"] { --ts-checkbox-accent-light: rgb(14, 157, 109); --ts-checkbox-accent-dark: rgb(16, 185, 129); --ts-checkbox-on-accent-light: #ffffff; --ts-checkbox-on-accent-dark: #10161a; --ts-checkbox-wash-light: rgba(16, 185, 129, 0.09); --ts-checkbox-wash-dark: rgba(16, 185, 129, 0.16); --ts-checkbox-beacon-light: rgba(14, 157, 109, 0.52); --ts-checkbox-beacon-dark: rgba(16, 185, 129, 0.68); }
      span.rm-page-ref[data-task-status-key="BUG"], .ts-status-pill-preview[data-task-status-key="BUG"], .ts-status-choice-glyph[data-task-status-key="BUG"] { --ts-status-bg-light: rgba(101, 163, 13, 0.1); --ts-status-fg-light: rgb(71, 114, 9); --ts-status-border-light: rgba(95, 153, 12, 0.48); --ts-status-bg-dark: rgba(101, 163, 13, 0.2); --ts-status-fg-dark: rgb(144, 189, 80); --ts-status-border-dark: rgba(101, 163, 13, 0.62); }
      .rm-checkbox[data-ts-checkbox-status="BUG"] { --ts-checkbox-accent-light: rgb(95, 153, 12); --ts-checkbox-accent-dark: rgb(101, 163, 13); --ts-checkbox-on-accent-light: #ffffff; --ts-checkbox-on-accent-dark: #10161a; --ts-checkbox-wash-light: rgba(101, 163, 13, 0.09); --ts-checkbox-wash-dark: rgba(101, 163, 13, 0.16); --ts-checkbox-beacon-light: rgba(95, 153, 12, 0.52); --ts-checkbox-beacon-dark: rgba(101, 163, 13, 0.68); }
      span.rm-page-ref[data-task-status-key="DRAFT"], .ts-status-pill-preview[data-task-status-key="DRAFT"], .ts-status-choice-glyph[data-task-status-key="DRAFT"] { --ts-status-bg-light: rgba(59, 130, 246, 0.1); --ts-status-fg-light: rgb(45, 99, 187); --ts-status-border-light: rgba(59, 130, 246, 0.48); --ts-status-bg-dark: rgba(59, 130, 246, 0.2); --ts-status-fg-dark: rgb(126, 172, 249); --ts-status-border-dark: rgba(59, 130, 246, 0.62); }
      .rm-checkbox[data-ts-checkbox-status="DRAFT"] { --ts-checkbox-accent-light: rgb(59, 130, 246); --ts-checkbox-accent-dark: rgb(59, 130, 246); --ts-checkbox-on-accent-light: #ffffff; --ts-checkbox-on-accent-dark: #ffffff; --ts-checkbox-wash-light: rgba(59, 130, 246, 0.09); --ts-checkbox-wash-dark: rgba(59, 130, 246, 0.16); --ts-checkbox-beacon-light: rgba(59, 130, 246, 0.52); --ts-checkbox-beacon-dark: rgba(59, 130, 246, 0.68); }
      span.rm-page-ref[data-task-status-key="DEADLINE"], .ts-status-pill-preview[data-task-status-key="DEADLINE"], .ts-status-choice-glyph[data-task-status-key="DEADLINE"] { --ts-status-bg-light: rgba(234, 88, 12, 0.1); --ts-status-fg-light: rgb(174, 66, 9); --ts-status-border-light: rgba(234, 88, 12, 0.48); --ts-status-bg-dark: rgba(234, 88, 12, 0.2); --ts-status-fg-dark: rgb(241, 143, 92); --ts-status-border-dark: rgba(234, 88, 12, 0.62); }
      .rm-checkbox[data-ts-checkbox-status="DEADLINE"] { --ts-checkbox-accent-light: rgb(234, 88, 12); --ts-checkbox-accent-dark: rgb(234, 88, 12); --ts-checkbox-on-accent-light: #ffffff; --ts-checkbox-on-accent-dark: #ffffff; --ts-checkbox-wash-light: rgba(234, 88, 12, 0.09); --ts-checkbox-wash-dark: rgba(234, 88, 12, 0.16); --ts-checkbox-beacon-light: rgba(234, 88, 12, 0.52); --ts-checkbox-beacon-dark: rgba(234, 88, 12, 0.68); }
      span.rm-page-ref[data-task-status-key="CUSTOM_DEEP_WORK"], .ts-status-pill-preview[data-task-status-key="CUSTOM_DEEP_WORK"], .ts-status-choice-glyph[data-task-status-key="CUSTOM_DEEP_WORK"] { --ts-status-bg-light: rgba(100, 116, 139, 0.1); --ts-status-fg-light: rgb(88, 102, 122); --ts-status-border-light: rgba(100, 116, 139, 0.48); --ts-status-bg-dark: rgba(100, 116, 139, 0.2); --ts-status-fg-dark: rgb(158, 168, 183); --ts-status-border-dark: rgba(105, 121, 143, 0.62); }
      .rm-checkbox[data-ts-checkbox-status="CUSTOM_DEEP_WORK"] { --ts-checkbox-accent-light: rgb(100, 116, 139); --ts-checkbox-accent-dark: rgb(105, 121, 143); --ts-checkbox-on-accent-light: #ffffff; --ts-checkbox-on-accent-dark: #ffffff; --ts-checkbox-wash-light: rgba(100, 116, 139, 0.09); --ts-checkbox-wash-dark: rgba(100, 116, 139, 0.16); --ts-checkbox-beacon-light: rgba(100, 116, 139, 0.52); --ts-checkbox-beacon-dark: rgba(105, 121, 143, 0.68); }
    </style>
  </head>
  <body>
    <main>
      <header class="toolbar">
        <h1>Task Status Tags Gallery</h1>
        <div class="controls">
          <div class="control-group" role="group" aria-label="Theme">
            <button type="button" data-theme-choice="light" aria-pressed="true">Light</button>
            <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
          </div>
          <div class="control-group" role="group" aria-label="Checkbox style">
            <button type="button" data-style-choice="outline" aria-pressed="true">Outline</button>
            <button type="button" data-style-choice="glass" aria-pressed="false">Glass</button>
            <button type="button" data-style-choice="solid" aria-pressed="false">Solid</button>
            <button type="button" data-style-choice="minimal" aria-pressed="false">Minimal</button>
          </div>
          <div class="control-group" role="group" aria-label="Pop animation">
            <button type="button" id="replay-pop">Replay pop</button>
          </div>
        </div>
      </header>

      <section class="statuses-section" aria-label="All statuses">
        <div class="section-title">All 21 statuses + custom (Active plays status-change pop on reload)</div>
        <div id="groups-grid" class="groups-grid"></div>
      </section>

      <section class="styles-section" aria-label="Four checkbox styles">
        <div class="section-title">Checkbox styles side by side</div>
        <div id="styles-grid" class="styles-grid"></div>
      </section>

      <section class="extras-preview-section" aria-label="Chooser and settings preview">
        <div class="section-title">Chooser glyph column and settings style preview</div>
        <div class="preview-showcase">
          <div class="ts-status-portal" id="chooser-preview"></div>
          <div class="preview-card">
            <h2>Settings style preview</h2>
            <div id="settings-style-preview"></div>
          </div>
        </div>
      </section>
    </main>

    <script>
      (function () {
        var GROUPS = [
          {
            title: "Task statuses (7)",
            items: [
              { key: "ACTIVE", shape: "active", name: "Active", glyph: null },
              { key: "WAITING", shape: "waiting", name: "Waiting", glyph: null },
              { key: "IN_REVIEW", shape: "in-review", name: "In Review", glyph: null },
              { key: "HOLDING", shape: "holding", name: "Holding", glyph: null },
              { key: "INCUBATING", shape: "incubating", name: "Incubating", glyph: null },
              { key: "ALERT", shape: "alert", name: "Alert", glyph: null },
              { key: "CANCELLED", shape: "cancelled", name: "Cancelled", glyph: null }
            ]
          },
          {
            title: "Media statuses (7)",
            items: [
              { key: "SERIES", shape: "series", name: "Series", glyph: "series" },
              { key: "MOVIE", shape: "movie", name: "Movie", glyph: "movie" },
              { key: "WATCHING", shape: "watching", name: "Watching", glyph: "watching" },
              { key: "WATCHLIST", shape: "watchlist", name: "Watchlist", glyph: "watchlist" },
              { key: "UPCOMING", shape: "upcoming", name: "Upcoming", glyph: "upcoming" },
              { key: "REWATCH", shape: "rewatch", name: "Rewatch", glyph: "rewatch" },
              { key: "DROPPED", shape: "dropped", name: "Dropped", glyph: "dropped" }
            ]
          },
          {
            title: "Extra statuses (7) + Custom (1)",
            items: [
              { key: "IMPORTANT", shape: "important", name: "Important", glyph: "important" },
              { key: "STARRED", shape: "starred", name: "Starred", glyph: "starred" },
              { key: "DISCUSS", shape: "discuss", name: "Discuss", glyph: "discuss" },
              { key: "BILLABLE", shape: "billable", name: "Billable", glyph: "billable" },
              { key: "BUG", shape: "bug", name: "Bug", glyph: "bug" },
              { key: "DRAFT", shape: "draft", name: "Draft", glyph: "draft" },
              { key: "DEADLINE", shape: "deadline", name: "Deadline", glyph: "deadline" },
              { key: "CUSTOM_DEEP_WORK", shape: "custom", name: "Deep Work", glyph: null }
            ]
          }
        ];

        var ALL_ITEMS = GROUPS.reduce(function (acc, group) {
          return acc.concat(group.items);
        }, []);

        var STYLES = [
          { id: "outline", label: "Outline" },
          { id: "glass", label: "Glass" },
          { id: "solid", label: "Solid" },
          { id: "minimal", label: "Minimal" }
        ];

        function checkboxMarkup(item, checked, pop) {
          var stateClass = checked ? "rm-done" : "rm-todo";
          var checkedAttr = checked ? " checked" : "";
          var popAttr = !checked && pop ? ' data-ts-status-pop="true"' : "";
          return (
            '<span class="rm-checkbox ' + stateClass + '" ' +
            'data-ts-checkbox-status="' + item.key + '" ' +
            'data-ts-checkbox-shape="' + item.shape + '"' + popAttr + ">" +
            '<label class="check-container">' +
            '<input type="checkbox"' + checkedAttr + ' aria-label="' + item.name + '" />' +
            '<span class="checkmark"></span>' +
            "</label></span>"
          );
        }

        function pillMarkup(item) {
          var glyphAttr = item.glyph ? ' data-ts-status-glyph="' + item.glyph + '"' : "";
          return (
            '<span class="rm-page-ref" ' +
            'data-tag="task-status/' + item.name + '" ' +
            'data-task-status-key="' + item.key + '" ' +
            'data-task-status-label="' + item.name + '"' +
            glyphAttr +
            ">#[[task-status/" + item.name + "]]</span>"
          );
        }

        function renderMainGroups() {
          var container = document.getElementById("groups-grid");
          container.innerHTML = GROUPS.map(function (group) {
            var rows = group.items.map(function (item) {
              var hasPop = item.key === "ACTIVE";
              var popNote = hasPop ? '<span class="pop-badge">pop</span>' : "";
              return (
                '<div class="status-row">' +
                checkboxMarkup(item, false, hasPop) +
                checkboxMarkup(item, true, false) +
                '<span class="status-name">' + item.name + popNote + "</span>" +
                pillMarkup(item) +
                "</div>"
              );
            }).join("");
            return (
              '<section class="group-card">' +
              "<h2>" + group.title + "</h2>" +
              '<div class="status-row status-row-header">' +
              "<span>Open</span><span>Done</span><span>Status</span><span>Pill</span>" +
              "</div>" +
              rows +
              "</section>"
            );
          }).join("");
        }

        function renderChooserAndSettingsPreview() {
          var chooserHost = document.getElementById("chooser-preview");
          var sampleChooser = [
            { group: "task", items: GROUPS[0].items.slice(0, 4) },
            { group: "media", items: GROUPS[1].items.slice(0, 3) },
            { group: "extra", items: GROUPS[2].items.slice(0, 3) }
          ];
          var digit = 1;
          var listItems = [];
          sampleChooser.forEach(function (section, idx) {
            if (idx > 0) {
              listItems.push('<li class="bp3-menu-divider ts-status-choice-divider" role="separator"></li>');
            }
            section.items.forEach(function (item) {
              var isCurrent = item.key === "WAITING";
              var glyphAttr = item.glyph ? ' data-ts-status-glyph="' + item.glyph + '"' : "";
              var hint = digit <= 9 ? '<span class="ts-status-choice-shortcut bp3-menu-item-label" aria-hidden="true">' + digit + "</span>" : "";
              digit += 1;
              listItems.push(
                '<li><a class="ts-status-choice bp3-menu-item' + (isCurrent ? " bp3-active bp3-intent-primary" : "") + '"' +
                (isCurrent ? ' aria-current="true"' : "") + ">" +
                '<span class="ts-status-choice-glyph" aria-hidden="true" data-task-status-key="' + item.key + '"' + glyphAttr + "></span>" +
                '<div class="ts-status-choice-label bp3-fill">' + item.name + "</div>" +
                hint +
                "</a></li>"
              );
            });
          });
          listItems.push(
            '<li><a class="ts-status-choice ts-status-choice-remove bp3-menu-item"><div class="ts-status-choice-label bp3-fill">Remove status</div></a></li>',
            '<li class="bp3-menu-divider ts-status-choice-divider" role="separator"></li>',
            '<li><a class="ts-status-choice ts-status-choice-view bp3-menu-item"><div class="ts-status-choice-label bp3-fill">Watching now\u2026</div></a></li>',
            '<li><a class="ts-status-choice ts-status-choice-settings bp3-menu-item"><div class="ts-status-choice-label bp3-fill">Settings\u2026</div></a></li>'
          );
          chooserHost.innerHTML =
            '<div class="ts-status-chooser bp3-popover"><div class="bp3-popover-content"><ul class="ts-status-choice-list bp3-menu" role="menu">' +
            listItems.join("") +
            "</ul></div></div>";

          var previewHost = document.getElementById("settings-style-preview");
          var previewKeys = ["ACTIVE", "WAITING", "IN_REVIEW", "HOLDING", "ALERT", "WATCHING"];
          var previewItems = previewKeys.map(function (key) {
            return ALL_ITEMS.find(function (item) { return item.key === key; });
          }).filter(Boolean);
          previewHost.innerHTML =
            '<div class="ts-style-preview">' +
            previewItems.map(function (item) {
              return (
                '<span class="ts-style-preview-item">' +
                checkboxMarkup(item, false, false) +
                '<span class="ts-style-preview-label">' + item.name + "</span>" +
                "</span>"
              );
            }).join("") +
            "</div>";
        }

        function buildStyleFrameDoc(style, theme) {
          var cssHref = new URL("../../extension.css", window.location.href).href;
          var baseCss = document.getElementById("ts-gallery-base").textContent;
          var paletteCss = document.getElementById("ts-gallery-palette").textContent;
          var styleAttr = style.id === "outline" ? "" : ' data-ts-checkbox-style="' + style.id + '"';
          var rows = ALL_ITEMS.map(function (item) {
            return (
              '<div class="status-row" style="grid-template-columns: 24px 24px minmax(0, 1fr);">' +
              checkboxMarkup(item, false) +
              checkboxMarkup(item, true) +
              '<span class="status-name">' + item.name + "</span>" +
              "</div>"
            );
          }).join("");
          return (
            '<!doctype html><html lang="en" data-ts-theme="' + theme + '"' + styleAttr + ">" +
            '<head><meta charset="utf-8" />' +
            '<link rel="stylesheet" href="' + cssHref + '" />' +
            "<style>" + baseCss + "\n" + paletteCss + "\n" +
            "body { background: var(--svy-raised); padding: 12px 14px; }\n" +
            "h2 { margin: 0 0 8px; font-size: 13px; font-weight: 650; }\n" +
            ".status-row { min-height: 30px; }\n" +
            "</style></head>" +
            "<body><h2>" + style.label + "</h2>" + rows + "</body></html>"
          );
        }

        function renderStyleFrames(theme) {
          var grid = document.getElementById("styles-grid");
          grid.innerHTML = "";
          STYLES.forEach(function (style) {
            var card = document.createElement("div");
            card.className = "style-frame-card";
            var frame = document.createElement("iframe");
            frame.setAttribute("title", style.label + " checkbox style (" + theme + ")");
            frame.srcdoc = buildStyleFrameDoc(style, theme);
            card.appendChild(frame);
            grid.appendChild(card);
          });
        }

        var currentTheme = "light";
        var currentStyle = "outline";

        function applyState() {
          document.documentElement.setAttribute("data-ts-theme", currentTheme);
          if (currentStyle === "outline") {
            document.documentElement.removeAttribute("data-ts-checkbox-style");
          } else {
            document.documentElement.setAttribute("data-ts-checkbox-style", currentStyle);
          }
          document.querySelectorAll("[data-theme-choice]").forEach(function (btn) {
            btn.setAttribute("aria-pressed", btn.getAttribute("data-theme-choice") === currentTheme ? "true" : "false");
          });
          document.querySelectorAll("[data-style-choice]").forEach(function (btn) {
            btn.setAttribute("aria-pressed", btn.getAttribute("data-style-choice") === currentStyle ? "true" : "false");
          });
          renderStyleFrames(currentTheme);
        }

        var params = new URLSearchParams(window.location.search);
        if (params.get("theme") === "dark") currentTheme = "dark";
        if (["outline", "glass", "solid", "minimal"].indexOf(params.get("style")) >= 0) {
          currentStyle = params.get("style");
        }
        if (params.get("section") === "statuses") document.body.classList.add("only-statuses");
        if (params.get("section") === "styles") document.body.classList.add("only-styles");
        if (params.get("toolbar") === "0") document.body.classList.add("hide-toolbar");

        document.querySelectorAll("[data-theme-choice]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            currentTheme = btn.getAttribute("data-theme-choice");
            applyState();
          });
        });

        document.querySelectorAll("[data-style-choice]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            currentStyle = btn.getAttribute("data-style-choice");
            applyState();
          });
        });

        document.getElementById("replay-pop").addEventListener("click", function () {
          var target = document.querySelector('#groups-grid .rm-checkbox[data-ts-checkbox-status="ACTIVE"].rm-todo');
          if (!target) return;
          target.removeAttribute("data-ts-status-pop");
          void target.offsetWidth;
          target.setAttribute("data-ts-status-pop", "true");
        });

        renderMainGroups();
        renderChooserAndSettingsPreview();
        applyState();
      })();
    </script>
  </body>
</html>
